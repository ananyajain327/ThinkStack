server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: thinkstack-api

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:thinkstack}
    username: ${DB_USERNAME:thinkstack}
    password: ${DB_PASSWORD:thinkstack_dev_2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

thinkstack:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-characters-long-enough-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:openai}
  model: ${AI_MODEL:gpt-4o-mini}
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:}
  timeout-ms: ${AI_TIMEOUT_MS:5000}
  max-tokens: ${AI_MAX_TOKENS:200}

logging:
  level:
    com.thinkstack: INFO
    org.springframework.security: WARN


  port: 8080

spring:
  application:
    name: thinkstack-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/thinkstack
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: your_jwt_secret_key_change_in_production_thinkstack_secure_key_32_chars
  expiration: 86400000

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.thinkstack: DEBUG
    org.hibernate.SQL: DEBUG
services:
  postgres:
    image: postgres:16-alpine
    container_name: thinkstack-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thinkstack}
      POSTGRES_USER: ${POSTGRES_USER:-thinkstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thinkstack_dev_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thinkstack} -d ${POSTGRES_DB:-thinkstack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: thinkstack-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-thinkstack}
      DB_USERNAME: ${POSTGRES_USER:-thinkstack}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-thinkstack_dev_2024}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-characters-long-enough-for-hs256}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    container_name: thinkstack-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
    driver: local
